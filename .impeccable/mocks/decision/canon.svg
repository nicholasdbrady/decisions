<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">JEV desktop command workspace — reminder classification</title>
  <desc id="desc">A polished conventional SaaS desktop interface showing the command remind me to pay rent tomorrow classified as a Reminder, with reminder fields, candidate probabilities, latency, and recent results.</desc>
  <defs>
    <linearGradient id="page" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset="1" stop-color="#f1f5f9"/>
    </linearGradient>
    <linearGradient id="command" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#f8fbff"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#0f172a" flood-opacity=".08"/>
    </filter>
    <filter id="smallShadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="3" stdDeviation="6" flood-color="#0f172a" flood-opacity=".07"/>
    </filter>
    <style>
      .sans { font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; }
      .ink { fill: #0f172a; }
      .muted { fill: #64748b; }
      .subtle { fill: #94a3b8; }
      .label { font-size: 12px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; }
      .body { font-size: 14px; }
      .small { font-size: 12px; }
      .medium { font-size: 16px; }
      .semibold { font-weight: 600; }
      .bold { font-weight: 700; }
    </style>
  </defs>

  <rect width="1600" height="1000" fill="url(#page)"/>

  <!-- App chrome -->
  <rect width="1600" height="72" fill="#ffffff"/>
  <line x1="0" y1="71.5" x2="1600" y2="71.5" stroke="#e2e8f0"/>
  <g class="sans">
    <rect x="48" y="20" width="32" height="32" rx="8" fill="#2563eb"/>
    <path d="M57 30.5h14M57 36h10M57 41.5h7" stroke="#fff" stroke-width="2" stroke-linecap="round"/>
    <text x="92" y="42" class="ink" font-size="20" font-weight="750" letter-spacing="-.02em">JEV</text>
    <text x="139" y="42" class="muted" font-size="13">Command workspace</text>

    <g transform="translate(1334 22)">
      <circle cx="14" cy="14" r="14" fill="#e0e7ff"/>
      <text x="14" y="18" text-anchor="middle" fill="#3730a3" font-size="12" font-weight="700">N</text>
      <text x="40" y="18" class="ink" font-size="13" font-weight="600">Nicholas</text>
      <path d="m112 11 4 4 4-4" fill="none" stroke="#64748b" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </g>

  <!-- Main layout -->
  <g class="sans">
    <text x="104" y="132" class="ink" font-size="28" font-weight="700" letter-spacing="-.03em">What can I help you with?</text>
    <text x="104" y="160" class="muted" font-size="14">Type a command and JEV will turn it into the right tool.</text>

    <!-- Main command card -->
    <rect x="104" y="196" width="1018" height="436" rx="18" fill="url(#command)" stroke="#dbe5f0" filter="url(#shadow)"/>
    <rect x="104" y="196" width="1018" height="5" rx="2.5" fill="#2563eb"/>

    <text x="136" y="239" class="muted label">Command</text>
    <rect x="136" y="258" width="954" height="72" rx="12" fill="#ffffff" stroke="#93c5fd" stroke-width="2"/>
    <circle cx="168" cy="294" r="11" fill="#eff6ff"/>
    <path d="M168 288v12M162 294h12" stroke="#2563eb" stroke-width="1.8" stroke-linecap="round"/>
    <text x="196" y="302" class="ink" font-size="22" font-weight="500" letter-spacing="-.01em">remind me to pay rent tomorrow</text>
    <rect x="1056" y="280" width="2" height="28" rx="1" fill="#2563eb"/>

    <!-- Classification row -->
    <text x="136" y="374" class="muted label">Detected intent</text>
    <rect x="136" y="392" width="210" height="48" rx="10" fill="#eff6ff" stroke="#bfdbfe"/>
    <circle cx="161" cy="416" r="9" fill="#2563eb"/>
    <path d="M161 410v7l4 2" fill="none" stroke="#fff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="181" y="422" fill="#1d4ed8" font-size="16" font-weight="700">Reminder</text>
    <rect x="364" y="392" width="154" height="48" rx="10" fill="#f8fafc" stroke="#e2e8f0"/>
    <text x="389" y="422" class="muted medium semibold">94.2% confident</text>

    <line x1="136" y1="476" x2="1090" y2="476" stroke="#e2e8f0"/>
    <text x="136" y="513" class="ink" font-size="17" font-weight="700">Reminder details</text>
    <text x="136" y="538" class="muted body">Review the fields before adding this local reminder.</text>

    <text x="136" y="577" class="muted label">Reminder</text>
    <rect x="136" y="589" width="286" height="32" rx="7" fill="#f8fafc" stroke="#e2e8f0"/>
    <text x="151" y="610" class="ink body semibold">Pay rent</text>
    <text x="452" y="577" class="muted label">Due</text>
    <rect x="452" y="589" width="188" height="32" rx="7" fill="#f8fafc" stroke="#e2e8f0"/>
    <text x="467" y="610" class="ink body semibold">Tomorrow · May 18</text>
    <text x="670" y="577" class="muted label">Time</text>
    <rect x="670" y="589" width="146" height="32" rx="7" fill="#f8fafc" stroke="#e2e8f0"/>
    <text x="685" y="610" class="ink body semibold">9:00 AM</text>
    <rect x="946" y="578" width="144" height="44" rx="9" fill="#2563eb" filter="url(#smallShadow)"/>
    <path d="M969 599h12M975 593v12" stroke="#fff" stroke-width="1.8" stroke-linecap="round"/>
    <text x="989" y="605" fill="#fff" font-size="14" font-weight="700">Add reminder</text>

    <!-- Inspector -->
    <rect x="1152" y="196" width="344" height="436" rx="18" fill="#ffffff" stroke="#dbe5f0" filter="url(#smallShadow)"/>
    <text x="1184" y="239" class="ink" font-size="17" font-weight="700">Inspector</text>
    <rect x="1392" y="220" width="72" height="28" rx="14" fill="#eff6ff"/>
    <circle cx="1409" cy="234" r="5" fill="#22c55e"/>
    <text x="1420" y="239" fill="#166534" font-size="11" font-weight="700">LIVE</text>
    <text x="1184" y="276" class="muted body">Candidate probabilities</text>
    <line x1="1184" y1="292" x2="1464" y2="292" stroke="#e2e8f0"/>

    <text x="1184" y="323" class="ink body semibold">Reminder</text>
    <text x="1464" y="323" text-anchor="end" fill="#1d4ed8" class="body bold">94.2%</text>
    <rect x="1184" y="333" width="280" height="7" rx="3.5" fill="#dbeafe"/>
    <rect x="1184" y="333" width="264" height="7" rx="3.5" fill="#2563eb"/>
    <text x="1184" y="369" class="ink body semibold">Event</text>
    <text x="1464" y="369" text-anchor="end" class="muted body semibold">2.7%</text>
    <rect x="1184" y="379" width="280" height="7" rx="3.5" fill="#f1f5f9"/>
    <rect x="1184" y="379" width="26" height="7" rx="3.5" fill="#94a3b8"/>
    <text x="1184" y="415" class="ink body semibold">Checklist</text>
    <text x="1464" y="415" text-anchor="end" class="muted body semibold">1.8%</text>
    <rect x="1184" y="425" width="280" height="7" rx="3.5" fill="#f1f5f9"/>
    <rect x="1184" y="425" width="18" height="7" rx="3.5" fill="#94a3b8"/>
    <text x="1184" y="461" class="ink body semibold">Other</text>
    <text x="1464" y="461" text-anchor="end" class="muted body semibold">1.3%</text>
    <rect x="1184" y="471" width="280" height="7" rx="3.5" fill="#f1f5f9"/>
    <rect x="1184" y="471" width="13" height="7" rx="3.5" fill="#94a3b8"/>

    <line x1="1184" y1="508" x2="1464" y2="508" stroke="#e2e8f0"/>
    <text x="1184" y="539" class="muted body">Provider</text>
    <text x="1464" y="539" text-anchor="end" class="ink body semibold">OpenRouter Decisions</text>
    <text x="1184" y="572" class="muted body">Classification latency</text>
    <text x="1464" y="572" text-anchor="end" class="ink body semibold">184 ms</text>
    <text x="1184" y="605" class="muted body">Switching policy</text>
    <text x="1464" y="605" text-anchor="end" class="ink body semibold">94% confidence</text>

    <!-- Recent results -->
    <text x="104" y="706" class="ink" font-size="20" font-weight="700" letter-spacing="-.02em">Recent results</text>
    <text x="104" y="732" class="muted body">Local objects created from your latest commands.</text>
    <rect x="1340" y="694" width="156" height="36" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
    <path d="M1361 711h14M1368 704v14" stroke="#475569" stroke-width="1.6" stroke-linecap="round"/>
    <text x="1386" y="717" class="muted body semibold">View history</text>

    <rect x="104" y="764" width="1392" height="114" rx="14" fill="#ffffff" stroke="#e2e8f0"/>
    <rect x="128" y="788" width="42" height="42" rx="10" fill="#eff6ff"/>
    <circle cx="149" cy="809" r="9" fill="none" stroke="#2563eb" stroke-width="1.8"/>
    <path d="M149 803v7l4 2" fill="none" stroke="#2563eb" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="194" y="801" class="ink medium bold">Pay rent</text>
    <rect x="276" y="785" width="82" height="24" rx="12" fill="#f1f5f9"/>
    <text x="317" y="801" text-anchor="middle" class="muted small semibold">Reminder</text>
    <text x="194" y="825" class="muted body">Tomorrow, May 18 at 9:00 AM</text>
    <text x="1370" y="801" text-anchor="end" class="muted small">Added just now</text>
    <text x="1370" y="826" text-anchor="end" fill="#166534" class="small semibold">Local only</text>
    <path d="M1436 808h24M1454 802l6 6-6 6" fill="none" stroke="#94a3b8" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>

    <rect x="104" y="894" width="1392" height="1" fill="#e2e8f0"/>
    <text x="104" y="928" class="subtle small">JEV selects a typed object first, then enriches its fields.</text>
    <text x="1496" y="928" text-anchor="end" class="subtle small">No external actions are performed.</text>
  </g>
</svg>
