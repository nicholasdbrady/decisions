[project]
name = "backend"
version = "0.1.0"
description = "JEV command canvas backend using FastAPI, AG-UI, and Microsoft Agent Framework"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "agent-framework-ag-ui[a2ui]>=1.4.0,<2",
    "agent-framework-core>=1.19.0,<2",
    "agent-framework-openai>=1.14.4,<2",
    "azure-ai-projects>=2.0.0",
    "azure-identity==1.25.3",
    "azure-monitor-opentelemetry>=1.8.10",
    "fastapi>=0.141.1",
    "holidays>=0.104",
    "httpx>=0.28.1",
    "opentelemetry-instrumentation-fastapi>=0.65b0",
    "opentelemetry-instrumentation-httpx>=0.65b0",
    "opentelemetry-sdk>=1.44.0",
    "pint>=0.26.1",
    "pydantic==2.13.5",
    "pydantic-settings==2.15.0",
    "tzdata>=2026.1",
    "uvicorn[standard]>=0.53.0",
]

[project.scripts]
backend = "backend.main:run"

[[tool.uv.index]]
url = "https://packagefeedproxy.microsoft.io/pypi/simple"
default = true

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.8",
]
